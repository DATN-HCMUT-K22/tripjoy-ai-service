# ================================================================
# deploy-staging.yml — Staging Deployment Pipeline for AI Service
#
# TRIGGER: Push/merge to branch 'staging'
#
# FLOW:
#   staging branch ← merge from feat/fix/perform/refactor/*
#        │
#        ├─ Job 1: lint — Ruff & mypy safety check
#        │
#        ├─ Job 2: build-and-push
#        │     Build Docker image with tags:
#        │       staging       (latest staging commit)
#        │       staging-<sha> (immutable tag)
#        │     Push to Docker Hub
#        │
#        └─ Job 3: deploy-to-staging
#              SSH into EC2 staging
#              Pull image → up → health check → done
#
# ================================================================

name: Deploy — Staging

on:
  push:
    branches:
      - staging

# Allow only one staging deployment at a time
concurrency:
  group: ai-deploy-staging
  cancel-in-progress: true

env:
  IMAGE_NAME: tripjoy-ai-service

jobs:
  # ============================================================
  # Job 1: Lint & Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

      - name: Run mypy type checker
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

  # ============================================================
  # Job 2: Build & Push Staging Docker Image
  # ============================================================
  build-and-push:
    name: Build & Push Staging Image
    runs-on: ubuntu-latest
    needs: lint

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 3: Deploy to Staging EC2
  # ============================================================
  deploy-to-staging:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          timeout: 600s
          script: |
            set -e

            echo "=== Deploying TripJoy AI Service Staging ==="

            mkdir -p ~/tripjoy-ai-service-staging
            cd ~/tripjoy-ai-service-staging

            echo "Syncing repository..."
            if [ -d ".git" ]; then
              git fetch origin staging
              git checkout staging
              git pull origin staging
            else
              git clone -b staging https://github.com/${{ github.repository }}.git .
            fi

            echo "Writing .env..."
            echo "${{ secrets.ENV_STAGING }}" | base64 -d > .env
            echo "" >> .env
            echo "IMAGE_TAG=staging" >> .env
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            echo "BACKEND_NETWORK_NAME=tripjoy-staging-network" >> .env
            echo "COMPOSE_PROJECT_NAME=tripjoy-staging" >> .env

            echo "Writing GCP credentials..."
            echo "${{ secrets.GCP_CREDENTIALS_JSON_STAGING }}" | base64 -d > credentials.json

            echo "Checking backend staging network..."
            docker network inspect tripjoy-staging-network >/dev/null 2>&1 || {
              echo "ERROR: tripjoy-staging-network does not exist. Deploy backend staging first."
              exit 1
            }

            echo "Logging in to Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling latest image..."
            IMAGE_TAG=staging DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.prod.yml pull tripjoy-ai-service

            echo "Restarting service..."
            IMAGE_TAG=staging DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans tripjoy-ai-service

            echo "Starting health check loop..."
            ST_PORT=$(grep "APP_PORT" .env | awk -F'=' '{print $2}' | tr -d '\r ' || echo "8000")
            ST_PORT=${ST_PORT:-8000}
            HEALTH_URL="http://127.0.0.1:$ST_PORT/health"
            
            MAX_RETRIES=30
            RETRY_COUNT=0
            HEALTH="DOWN"

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RESPONSE=$(curl -s "$HEALTH_URL" || echo "CONNECTION_ERROR")
              echo "Attempt $((RETRY_COUNT+1)): $RESPONSE"

              if echo "$RESPONSE" | grep -Eiq '"status"[[:space:]]*:[[:space:]]*"?(ok|up)"?'; then
                HEALTH="UP"
                break
              fi

              echo "AI service not ready yet. Retrying in 10s..."
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT+1))
            done

            if [ "$HEALTH" != "UP" ]; then
              echo "AI service did not become healthy."
              docker ps --filter "name=tripjoy-staging-ai-service"
              docker logs tripjoy-staging-ai-service --tail=100 || true
              exit 1
            fi

            echo "Testing backend -> AI network access..."
            docker exec tripjoy-staging-api curl -s http://tripjoy-ai-service:8000/health || echo "Skipping cross-container test"

            echo "Cleaning dangling images..."
            docker image prune -f

            echo "Final status:"
            docker compose -f docker-compose.prod.yml ps

            echo "=== Staging AI deployment complete ==="
