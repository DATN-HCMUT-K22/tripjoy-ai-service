name: CI/CD — TripJoy AI Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tripjoy-ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tripjoy-ai-service/**'

# Prevent concurrent runs on same branch
concurrency:
  group: ai-service-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tripjoy-ai-service

jobs:
  # ============================================================
  # JOB 1: Lint & Code Quality
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tripjoy-ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tripjoy-ai-service/requirements*.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

      - name: Run mypy type checker
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking for now (may have missing stubs)

  # ============================================================
  # JOB 2: Test
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./tripjoy-ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tripjoy-ai-service/requirements*.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          VERTEX_PROJECT_ID: test-project
          VERTEX_LOCATION: asia-southeast1
          VERTEX_MODEL: gemini-1.5-flash
          GG_API_KEY: test-key
          INTERNAL_API_KEY: test-internal-key
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Cho đến khi có tests

  # ============================================================
  # JOB 3: Build & Push Docker Image (main branch only)
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./tripjoy-ai-service
          file: ./tripjoy-ai-service/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 4: Deploy to Server via SSH (main branch only)
  # Requires GitHub Secrets:
  #   - DEPLOY_HOST: IP hoặc hostname của server
  #   - DEPLOY_USER: SSH username (e.g., ubuntu)
  #   - DEPLOY_SSH_KEY: Private SSH key (RSA/ED25519)
  #   - DEPLOY_PATH: Path trên server (e.g., /opt/tripjoy/ai-service)
  # ============================================================
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying TripJoy AI Service ==="
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest image
            docker pull ghcr.io/${{ github.repository_owner }}/tripjoy-ai-service:latest

            # Graceful restart (zero-downtime nếu có load balancer)
            docker-compose pull
            docker-compose up -d --no-deps tripjoy-ai-service

            # Verify health
            sleep 15
            docker-compose ps tripjoy-ai-service
            echo "=== Deployment complete ==="
